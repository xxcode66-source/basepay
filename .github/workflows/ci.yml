name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Smart Contract Tests ──────────────────────────────────
  contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run forge fmt check
        run: forge fmt --check

      - name: Run tests
        run: forge test -vvv

      - name: Build contracts
        run: forge build

  # ── Frontend Build & Lint ─────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: test
          NEXT_PUBLIC_TIP_ROUTER_ADDRESS: '0x0000000000000000000000000000000000000000'
          NEXT_PUBLIC_USDC_ADDRESS: '0x0000000000000000000000000000000000000000'
          NEXT_PUBLIC_TIP_ROUTER_USDT_ADDRESS: '0x0000000000000000000000000000000000000000'
          NEXT_PUBLIC_USDT_ADDRESS: '0x0000000000000000000000000000000000000000'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
